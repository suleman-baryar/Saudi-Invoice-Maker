<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <script>
      // Suppress Vite HMR / WebSocket connection errors in cloud container preview environments
      window.addEventListener('error', function (e) {
        var file = (e && e.filename) || '';
        var msg = (e && e.message) || '';
        if (file.indexOf('@vite/client') !== -1 || msg.indexOf('WebSocket') !== -1 || msg.indexOf('websocket') !== -1) {
          e.stopImmediatePropagation();
          e.preventDefault();
          return true;
        }
      }, true);
      window.addEventListener('unhandledrejection', function (e) {
        var reason = e && e.reason;
        var text = (reason && (reason.message || reason.stack || '')) || '';
        if (text.indexOf('@vite/client') !== -1 || text.indexOf('WebSocket') !== -1) {
          e.stopImmediatePropagation();
          e.preventDefault();
        }
      }, true);
    </script>
    <title>مركز المالك للدهانات - نظام إدارة المبيعات والمشتريات</title>
    <meta name="description" content="نظام متكامل لإدارة فواتير المبيعات والمشتريات والموردين والعملاء لمركز المالك للدهانات بالمملكة العربية السعودية، متوافق مع ضريبة القيمة المضافة 15% وتطبيق الجوال." />
    <meta property="og:title" content="مركز المالك للدهانات - نظام إدارة المبيعات والمشتريات" />
    <meta property="og:description" content="نظام احترافي لإدارة فواتير المبيعات والمشتريات والموردين وحساب الضريبة 15% لمركز المالك للدهانات." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />

  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Prevent unwanted mobile zooming when focusing inputs or double tapping
      document.addEventListener('gesturestart', function (e) {
        e.preventDefault();
      });

      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch((err) => {
            console.log('SW registration note:', err?.message);
          });
        });
      }
    </script>
  </body>
